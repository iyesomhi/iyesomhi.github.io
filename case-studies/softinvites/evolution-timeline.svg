<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="360" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1F3864">Product Evolution Timeline</text>
  <text x="500" y="64" text-anchor="middle" font-size="13" fill="#595959">From original specification to current Admin Portal</text>

  <!-- Timeline base line -->
  <line x1="100" y1="180" x2="900" y2="180" stroke="#B7C6D9" stroke-width="4"/>

  <!-- Node 1 -->
  <circle cx="150" cy="180" r="14" fill="#1F3864"/>
  <text x="150" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">June 2024</text>
  <rect x="40" y="210" width="220" height="120" rx="8" fill="#DCE6F1" stroke="#B7C6D9"/>
  <text x="150" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">Original BRD / FRD</text>
  <text x="60" y="258" font-size="11.5" fill="#262626">Event creation, guest-list</text>
  <text x="60" y="274" font-size="11.5" fill="#262626">management, unique QR</text>
  <text x="60" y="290" font-size="11.5" fill="#262626">codes, one-time-use scan,</text>
  <text x="60" y="306" font-size="11.5" fill="#262626">WhatsApp / email sharing</text>

  <!-- Node 2 -->
  <circle cx="500" cy="180" r="14" fill="#1B6B72"/>
  <text x="500" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1B6B72">Implementation &amp; Use</text>
  <rect x="390" y="210" width="220" height="120" rx="8" fill="#DCEEEF" stroke="#9FC8CB"/>
  <text x="500" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#1B6B72">Requirements Evolve</text>
  <text x="410" y="258" font-size="11.5" fill="#262626">Real operational use surfaces</text>
  <text x="410" y="274" font-size="11.5" fill="#262626">new needs: mobile/tablet use,</text>
  <text x="410" y="290" font-size="11.5" fill="#262626">RSVP tracking, event lifecycle</text>
  <text x="410" y="306" font-size="11.5" fill="#262626">views (All / Active / Expired)</text>

  <!-- Node 3 -->
  <circle cx="850" cy="180" r="14" fill="#1F3864"/>
  <text x="850" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">Current</text>
  <rect x="740" y="210" width="220" height="120" rx="8" fill="#DCE6F1" stroke="#B7C6D9"/>
  <text x="850" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">SoftInvites Admin Portal</text>
  <text x="760" y="258" font-size="11.5" fill="#262626">RSVP management, multichannel</text>
  <text x="760" y="274" font-size="11.5" fill="#262626">comms (WhatsApp/email, SMS in</text>
  <text x="760" y="290" font-size="11.5" fill="#262626">progress), analytics &amp; reporting,</text>
  <text x="760" y="306" font-size="11.5" fill="#262626">WhatsApp Replies workspace</text>

  <!-- Arrows between nodes -->
  <line x1="164" y1="180" x2="486" y2="180" stroke="#B7C6D9" stroke-width="0" />
  <polygon points="330,175 345,180 330,185" fill="#8EAADB"/>
  <polygon points="680,175 695,180 680,185" fill="#8EAADB"/>
</svg>
