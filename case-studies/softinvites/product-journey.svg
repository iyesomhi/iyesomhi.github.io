<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="460" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1F3864">End-to-End Product Journey</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#595959">From event setup to reporting on outcomes</text>

  <!-- helper: 5 boxes top row, 5 boxes bottom row, snake layout -->
  <!-- Row 1: steps 1-5 left to right -->
  <!-- Row 2: steps 6-10 right to left (snake) -->

  <!-- Step box template repeated -->
  <!-- Row 1 -->
  <g>
    <rect x="30"  y="100" width="168" height="86" rx="10" fill="#1F3864"/>
    <text x="114" y="130" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">1. Create &amp;</text>
    <text x="114" y="148" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">configure event</text>

    <rect x="228" y="100" width="168" height="86" rx="10" fill="#274C86"/>
    <text x="312" y="130" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">2. Add / import</text>
    <text x="312" y="148" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">guest list</text>

    <rect x="426" y="100" width="168" height="86" rx="10" fill="#2F5399"/>
    <text x="510" y="122" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">3. Generate QR</text>
    <text x="510" y="140" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">access credentials /</text>
    <text x="510" y="158" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">passes</text>

    <rect x="624" y="100" width="168" height="86" rx="10" fill="#3759AB"/>
    <text x="708" y="130" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">4. Configure the</text>
    <text x="708" y="148" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">RSVP experience</text>

    <rect x="822" y="100" width="148" height="86" rx="10" fill="#3F60B8"/>
    <text x="896" y="122" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="700">5. Disseminate</text>
    <text x="896" y="140" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="700">invitations &amp; RSVP</text>
    <text x="896" y="158" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="700">comms</text>
  </g>

  <!-- Row 1 arrows (pointing right) -->
  <polygon points="200,138 200,148 212,143" fill="#8EAADB"/>
  <polygon points="398,138 398,148 410,143" fill="#8EAADB"/>
  <polygon points="596,138 596,148 608,143" fill="#8EAADB"/>
  <polygon points="794,138 794,148 806,143" fill="#8EAADB"/>

  <!-- Down arrow from step5 to step6 -->
  <polygon points="890,190 896,204 902,190" fill="#8EAADB"/>

  <!-- Row 2: steps 6-10, right to left -->
  <g>
    <rect x="822" y="220" width="148" height="86" rx="10" fill="#1B6B72"/>
    <text x="896" y="250" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">6. Receive &amp;</text>
    <text x="896" y="268" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">track RSVPs</text>

    <rect x="624" y="220" width="168" height="86" rx="10" fill="#227781"/>
    <text x="708" y="242" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="700">7. Manage guest info</text>
    <text x="708" y="260" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="700">&amp; comms responses</text>

    <rect x="426" y="220" width="168" height="86" rx="10" fill="#298390"/>
    <text x="510" y="250" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">8. Validate guests</text>
    <text x="510" y="268" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">via QR scanning</text>

    <rect x="228" y="220" width="168" height="86" rx="10" fill="#308F9E"/>
    <text x="312" y="242" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="700">9. Monitor attendance,</text>
    <text x="312" y="260" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="700">RSVP &amp; comms metrics</text>

    <rect x="30" y="220" width="168" height="86" rx="10" fill="#379BAD"/>
    <text x="114" y="242" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">10. Export reports</text>
    <text x="114" y="260" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">&amp; review outcomes</text>
  </g>

  <!-- Row 2 arrows (pointing left, right to left) -->
  <polygon points="820,258 820,268 808,263" fill="#9FD3D9"/>
  <polygon points="622,258 622,268 610,263" fill="#9FD3D9"/>
  <polygon points="424,258 424,268 412,263" fill="#9FD3D9"/>
  <polygon points="226,258 226,268 214,263" fill="#9FD3D9"/>

  <!-- Legend / footer -->
  <text x="500" y="400" text-anchor="middle" font-size="12" fill="#595959">A continuous operational loop, not a one-time checklist &#8212; each event cycles through all 10 stages.</text>
</svg>
